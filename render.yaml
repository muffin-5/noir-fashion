# Render blueprint - deploy the Django + React app as a single web service.
# See https://render.com/docs/blueprint-spec for more options.
services:
  - type: web
    name: noir-store
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate && python manage.py seed && gunicorn endsem.wsgi:application
    healthCheckPath: /api/categories/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          name: noir-store
          type: web
          property: host
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Aiven enforces TLS; Render's system CA bundle validates Aiven certs.
      - key: DB_SSL_CA_PATH
        value: /etc/ssl/certs/ca-certificates.crt
      # Aiven MySQL: set DATABASE_URL to your Service URI in the Render UI, e.g.
      #   mysql://avnadmin:PASSWORD@host.aivencloud.com:PORT/defaultdb
      - key: DATABASE_URL
        sync: false
